name: AuraFX Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/aurafx-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true
      - name: Build test APK and unsigned release bundle
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraFX-test-APK
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload unsigned bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: AuraFX-unsigned-AAB-not-for-Play
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Build signed Play bundle
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          AURAFX_KEYSTORE_FILE: ${{ github.workspace }}/android/aurafx-upload.jks
          AURAFX_KEYSTORE_PASSWORD: ${{ secrets.AURAFX_KEYSTORE_PASSWORD }}
          AURAFX_KEY_ALIAS: ${{ secrets.AURAFX_KEY_ALIAS }}
          AURAFX_KEY_PASSWORD: ${{ secrets.AURAFX_KEY_PASSWORD }}
          AURAFX_KEYSTORE_BASE64: ${{ secrets.AURAFX_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$AURAFX_KEYSTORE_BASE64" | base64 -d > "$AURAFX_KEYSTORE_FILE"
          gradle --no-daemon :app:bundleRelease
          rm -f "$AURAFX_KEYSTORE_FILE"
      - name: Upload signed Play bundle
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: AuraFX-Google-Play-AAB
          path: android/app/build/outputs/bundle/release/*.aab
    env:
      HAS_SIGNING_KEY: ${{ secrets.AURAFX_KEYSTORE_BASE64 != '' && secrets.AURAFX_KEYSTORE_PASSWORD != '' && secrets.AURAFX_KEY_ALIAS != '' && secrets.AURAFX_KEY_PASSWORD != '' }}
