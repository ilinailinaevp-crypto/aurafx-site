plugins { id 'com.android.application' }

android {
    namespace 'ru.aurafx.design'
    compileSdk 36
    defaultConfig {
        applicationId 'ru.aurafx.design'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '3.0.0'
    }
    signingConfigs {
        release {
            if (System.getenv('AURAFX_KEYSTORE_FILE')) {
                storeFile file(System.getenv('AURAFX_KEYSTORE_FILE'))
                storePassword System.getenv('AURAFX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AURAFX_KEY_ALIAS')
                keyPassword System.getenv('AURAFX_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('AURAFX_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
